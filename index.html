<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338ca" />
    <meta name="description" content="Ghar PG Premium — Advanced Cloud PG Management with UPI, Budgeting, Lease Tracking, Analytics & Notifications." />
    <title>Ghar PG Premium — Advanced Cloud Management</title>

    <script>
        (function() {
            try {
                if (localStorage.getItem('gharPG_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>

    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#f0eeff',
                            100: '#e0dcff',
                            200: '#c4bdff',
                            300: '#a399ff',
                            400: '#8475fa',
                            500: '#6d4ff0',
                            600: '#5535d6',
                            700: '#462ab0',
                            800: '#39228c',
                            900: '#2a1868'
                        },
                        gold: {
                            300: '#fde68a',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706'
                        }
                    },
                    keyframes: {
                        'toast-in': { '0%': { opacity: 0, transform: 'translateY(12px) scale(.95)' }, '100%': { opacity: 1, transform: 'translateY(0) scale(1)' } },
                        'pop': { '0%': { transform: 'scale(.96)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
                        'shimmer': { '0%': { backgroundPosition: '-400px 0' }, '100%': { backgroundPosition: '400px 0' } },
                        'float': { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
                        'glow-pulse': { '0%,100%': { opacity: 0.55 }, '50%': { opacity: 1 } },
                        'slide-up': { '0%': { opacity: 0, transform: 'translateY(16px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        'pulse-ring': { '0%': { transform: 'scale(0.8)', opacity: 0.6 }, '100%': { transform: 'scale(1.6)', opacity: 0 } }
                    },
                    animation: {
                        'toast-in': 'toast-in .3s cubic-bezier(.22,.61,.36,1)',
                        'pop': 'pop .2s cubic-bezier(.22,.61,.36,1)',
                        'shimmer': 'shimmer 1.6s infinite linear',
                        'float': 'float 5s ease-in-out infinite',
                        'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
                        'slide-up': 'slide-up .35s cubic-bezier(.22,.61,.36,1)',
                        'pulse-ring': 'pulse-ring 1.5s ease-out infinite'
                    }
                }
            }
        };
    </script>

    <script src="https://unpkg.com/lucide@latest">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Outfit:wght@500;600;700;800;900&display=swap');

        html,
        body {
            font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
        }
        .font-display {
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(1200px 600px at 8% -8%, rgba(109, 79, 240, 0.10), transparent 65%),
                radial-gradient(1000px 550px at 100% 0%, rgba(245, 158, 11, 0.07), transparent 55%),
                radial-gradient(800px 550px at 50% 100%, rgba(16, 185, 129, 0.06), transparent 60%);
            background-attachment: fixed;
        }
        html.dark body {
            background-color: #090b1a;
            background-image: radial-gradient(1200px 600px at 8% -8%, rgba(109, 79, 240, 0.18), transparent 65%),
                radial-gradient(1000px 550px at 100% 0%, rgba(245, 158, 11, 0.08), transparent 55%),
                radial-gradient(800px 550px at 50% 100%, rgba(16, 185, 129, 0.06), transparent 60%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass {
            background: rgba(14, 16, 34, 0.65);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            transition: border-color .25s ease, box-shadow .25s ease;
        }
        .dark .glass-card {
            background: rgba(20, 23, 44, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.06);
        }
        .glass-card:hover {
            border-color: rgba(109, 79, 240, 0.20);
        }
        .dark .glass-card:hover {
            border-color: rgba(109, 79, 240, 0.15);
        }

        .premium-card-hover {
            transition: transform .3s cubic-bezier(.22, .61, .36, 1),
                box-shadow .3s cubic-bezier(.22, .61, .36, 1),
                border-color .3s ease;
        }
        .premium-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -16px rgba(109, 79, 240, 0.25);
        }
        .dark .premium-card-hover:hover {
            box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.6);
        }

        .btn-primary {
            background: linear-gradient(135deg, #5b3ad4, #6d4ff0 45%, #8b5cf6);
            box-shadow: 0 8px 24px -8px rgba(109, 79, 240, 0.5);
            transition: all .25s cubic-bezier(.22, .61, .36, 1);
        }
        .btn-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 12px 32px -10px rgba(109, 79, 240, 0.55);
        }
        .btn-primary:active {
            transform: scale(.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b 55%, #d97706);
            box-shadow: 0 8px 22px -8px rgba(217, 119, 6, 0.5);
        }

        .nav-btn-active {
            background: linear-gradient(135deg, #5b3ad4, #6d4ff0 50%, #8b5cf6);
            box-shadow: 0 8px 20px -8px rgba(109, 79, 240, 0.45);
            color: #fff !important;
        }

        .crown-badge {
            display: inline-flex;
            align-items: center;
            gap: .2rem;
            padding: .1rem .5rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #fde68a, #f59e0b);
            color: #4a2c00;
            font-size: .55rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .empty-state-icon {
            width: 4rem;
            height: 4rem;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(109, 79, 240, 0.10), rgba(245, 158, 11, 0.08));
            color: #6d4ff0;
            margin-bottom: .75rem;
        }
        .dark .empty-state-icon {
            color: #a399ff;
            background: linear-gradient(135deg, rgba(109, 79, 240, 0.15), rgba(245, 158, 11, 0.08));
        }

        .occ-bar-track {
            background: #ece9ff;
            border-radius: 9999px;
            overflow: hidden;
        }
        .dark .occ-bar-track {
            background: #241d4a;
        }

        .premium-input {
            transition: box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
        }
        .premium-input:focus {
            box-shadow: 0 0 0 4px rgba(109, 79, 240, 0.12);
            border-color: #6d4ff0;
        }
        .dark .premium-input:focus {
            box-shadow: 0 0 0 4px rgba(109, 79, 240, 0.20);
        }

        .field-error {
            display: none;
            font-size: .65rem;
            color: #f43f5e;
            margin-top: .25rem;
        }
        .field-invalid .field-error {
            display: block;
        }
        .field-invalid input,
        .field-invalid select {
            border-color: #f43f5e !important;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.12) !important;
        }

        .status-stamp {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: .3rem .9rem;
            border-radius: 9999px;
            font-weight: 800;
            font-size: .6rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            border: 2px solid currentColor;
            transform: rotate(-8deg);
            backdrop-filter: blur(4px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c4b5fd;
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4c3a99;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 35;
        }
        .sidebar-backdrop.active {
            display: block;
        }

        .notif-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #f43f5e;
            color: #fff;
            font-size: .55rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.4);
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableReport,
            #printableReport * {
                visibility: visible;
            }
            #printableReport {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: #fff !important;
                color: #000 !important;
                padding: 2rem !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200 antialiased">

    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 min-h-screen py-3 lg:py-6">

        <!-- AUTH SCREEN -->
        <div id="authScreen" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl animate-pop relative overflow-hidden border border-slate-200/30 dark:border-slate-700/30">
                <div class="blob w-64 h-64 bg-brand-500/15 -top-20 -right-20" aria-hidden="true"></div>
                <div class="blob w-48 h-48 bg-gold-400/10 -bottom-16 -left-16" aria-hidden="true"></div>
                <div class="text-center mb-6 relative">
                    <div class="inline-flex p-4 btn-primary text-white rounded-2xl mb-3 shadow-xl shadow-brand-500/25">
                        <i data-lucide="building-2" class="w-8 h-8"></i>
                    </div>
                    <h2 class="font-display text-2xl font-extrabold text-slate-900 dark:text-white">Ghar PG <span class="gold-gradient-text">Premium</span></h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Advanced Cloud PG Management with UPI</p>
                </div>

                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Mobile Number</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-3.5 text-slate-400 font-medium text-sm">+91</span>
                            <input type="tel" id="authMobile" maxlength="10" value="8651744312" placeholder="9876543210" class="premium-input w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none font-medium text-sm focus:border-brand-500 dark:focus:border-brand-400" required />
                        </div>
                    </div>
                    <div id="otpSection" class="hidden space-y-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Enter OTP</label>
                        <input type="text" id="authOtp" maxlength="6" value="123456" placeholder="6-digit OTP" class="premium-input w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-center outline-none font-bold tracking-widest text-lg focus:border-brand-500" />

                    <button type="button" id="sendOtpBtn" onclick="handleSendOTP()" class="w-full py-3.5 btn-primary text-white font-semibold rounded-xl transition active:scale-[0.98] flex items-center justify-center gap-2">

                    </button>
                    <button type="button" id="verifyOtpBtn" onclick="handleVerifyOTP()" class="hidden w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-500/25 transition active:scale-[0.98] flex items-center justify-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Verify &amp; Enter Dashboard
                    </button>
                    <button type="button" onclick="quickDemoLogin()" class="w-full py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium text-xs rounded-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="zap" class="w-3.5 h-3.5"></i> Quick Manager Login (1-Click)
                    </button>
                </form>
                <p class="text-[10px] text-center text-slate-400 dark:text-slate-500 mt-4">Data stored securely on this device.</p>
            </div>
        </div>
